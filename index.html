<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Voice Over Studio</title>

    <link
        rel="stylesheet"
        href="index.css"
    >
</head>

<body>

    <div class="app">

        <header>
            <h1>🎙️ Voice Over Studio</h1>

            <p>
                Turn your text into speech
            </p>
        </header>


        <main class="card">

            <label for="text">
                Voice-over script
            </label>

            <textarea
                id="text"
                placeholder="Write your script here...

Example:

Hello Matthew, welcome to today's video.

Today we're going to explain how this amazing technology works.

Let's get started."
            ></textarea>


            <div class="counter">

                <span id="count">0</span>
                characters

            </div>


            <label for="voice">
                🎙️ Select voice
            </label>

            <select id="voice">
                <option>
                    Loading voices...
                </option>
            </select>


            <div class="controls">

                <div class="control">

                    <label for="rate">
                        Speed
                    </label>

                    <input
                        type="range"
                        id="rate"
                        min="0.5"
                        max="2"
                        value="1"
                        step="0.1"
                    >

                    <span id="rateValue">
                        1.0
                    </span>

                </div>


                <div class="control">

                    <label for="pitch">
                        Pitch
                    </label>

                    <input
                        type="range"
                        id="pitch"
                        min="0"
                        max="2"
                        value="1"
                        step="0.1"
                    >

                    <span id="pitchValue">
                        1.0
                    </span>

                </div>

            </div>


            <div class="buttons">

                <button id="play">
                    ▶ Play
                </button>

                <button id="pause">
                    ⏸ Pause
                </button>

                <button id="resume">
                    ▶ Resume
                </button>

                <button id="stop">
                    ⏹ Stop
                </button>

            </div>


            <div class="download-area">

                <button
                    id="download"
                    class="download"
                >
                    ⬇️ Download Audio
                </button>

                <p id="downloadMessage">
                    Browser speech cannot be directly
                    exported as MP3.
                </p>

            </div>


            <div
                id="status"
                class="status"
            >
                Ready.
            </div>

        </main>


        <section class="tips">

            <h2>
                💡 Make your voice sound natural
            </h2>

            <p>
                Use commas for short pauses.
            </p>

            <p>
                Use full stops between ideas.
            </p>

            <p>
                Example:
                <strong>
                    "Matthew, welcome to the channel."
                </strong>
            </p>

        </section>

    </div>


    <script src="index.js"></script>

</body>

</html>
